name: Infra
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: [".github/workflows/infra.yml"]
jobs:
  subject:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - run: printf '%s' "https://bills.frostbun.com" | bunx wrangler secret put VAPID_SUBJECT
