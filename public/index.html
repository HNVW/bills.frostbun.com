<script type="module">
import { DICTS, ERROR_KEYS, LANGUAGES, SCHEMES } from "/i18n.js";

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
// One pencil, shared by the group title, bill cards and payment cards.
// On a phone, focusing a field inside a dialog opens the keyboard and covers half the screen before the
// person has read what the dialog says. Desktop keeps the convenience. Width only: a touchscreen laptop
// reports a coarse pointer but is still a desktop layout.
const wantsAutofocus = () => window.matchMedia("(min-width: 620px)").matches;
function autofocusIn(dlg) {
  if (!wantsAutofocus()) return;
  const field = dlg?.querySelector("[data-autofocus]");
  if (field) field.focus();
}

const editIcon = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M4 20h4l10-10a2.8 2.8 0 0 0-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>`;

/* ---------- i18n ---------- */

const DEFAULT_LANG = "vi-vn";
let lang = (localStorage.getItem("lang") || DEFAULT_LANG).toLowerCase();
if (!DICTS[lang]) lang = DEFAULT_LANG;

function t(key, params) {
  const s = DICTS[lang][key] ?? DICTS["en-us"][key] ?? key;
  return params ? s.replace(/\{(\w+)\}/g, (m, k) => (k in params ? String(params[k]) : m)) : s;
}

// Unknown API strings still surface: show the server text rather than a bare "error".
function errorText(message) {
  if (ERROR_KEYS[message]) return t(ERROR_KEYS[message]);
  const prefixed = Object.keys(ERROR_KEYS).find((k) => message.startsWith(k));
  if (prefixed) return t(ERROR_KEYS[prefixed]);
  return t("error.generic", { error: message });
}

const nf = () => new Intl.NumberFormat(lang === "vi-vn" ? "vi-VN" : "en-US");
const vnd = (n) => nf().format(Number(n)) + " ₫";
const date = (iso) => new Date(iso).toLocaleDateString(lang === "vi-vn" ? "vi-VN" : "en-US");
const dateTime = (iso) => new Date(iso).toLocaleString(lang === "vi-vn" ? "vi-VN" : "en-US");

/* ---------- scheme ---------- */

let scheme = localStorage.getItem("scheme") || "paper";
if (!SCHEMES.some((s) => s.id === scheme)) scheme = SCHEMES[0].id;
const PAPER_HEX = { paper: "#f9f6f2", newsprint: "#f1f4f6", moss: "#f2f6ee", porcelain: "#f7f6fa", midnight: "#101419", ink: "#120f0c", plum: "#150f15", forest: "#0e130f" };

function applyScheme(id, persist = true) {
  scheme = SCHEMES.some((s) => s.id === id) ? id : SCHEMES[0].id;
  document.documentElement.dataset.scheme = scheme;
  document.querySelector('meta[name="theme-color"]').content = PAPER_HEX[scheme];
  if (persist) localStorage.setItem("scheme", scheme);
}

function applyLang(code, repaint = true) {
  code = String(code).toLowerCase();
  if (!DICTS[code]) return;
  lang = code;
  document.documentElement.lang = code;
  localStorage.setItem("lang", code);
  paintChrome();
  if (repaint) render();
}

/* ---------- api ---------- */

const app = $("#app");

async function api(path, opts = {}) {
  const res = await fetch(path, { headers: opts.body instanceof FormData ? {} : { "content-type": "application/json" }, ...opts });
  if (res.status === 401) {
    app.innerHTML = `<p class="empty">${esc(t("push.notSignedIn"))}</p>`;
    throw new Error("unauthenticated");
  }
  const data = res.status === 204 ? null : await res.json().catch(() => null);
  if (!res.ok) throw new Error((data && data.error) || res.statusText);
  return data;
}

function fail(err) {
  alert(err.message === "unauthenticated" ? t("push.notSignedIn") : errorText(err.message || String(err)));
}

async function uploadImage(groupId, kind, entryId, file) {
  const fd = new FormData();
  fd.append("file", file);
  const { key } = await api(`/api/groups/${groupId}/${kind}/${entryId}/image`, { method: "POST", body: fd });
  return key;
}

const newId = () => crypto.randomUUID();

/* ---------- notifications ---------- */

const b64uToBytes = (s) => {
  const pad = s.replace(/-/g, "+").replace(/_/g, "/");
  return Uint8Array.from(atob(pad + "=".repeat((4 - (pad.length % 4)) % 4)), (c) => c.charCodeAt(0));
};

async function pushState() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) return "unsupported";
  if (Notification.permission === "denied") return "blocked";
  const reg = await navigator.serviceWorker.ready.catch(() => null);
  if (!reg) return "unsupported";
  const sub = await reg.pushManager.getSubscription();
  return sub ? "on" : "off";
}

async function enablePush() {
  const permission = await Notification.requestPermission();
  if (permission !== "granted") return false;
  const { publicKey } = await api("/api/push/key");
  if (!publicKey) throw new Error(t("push.unconfigured"));
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64uToBytes(publicKey) });
  await api("/api/push/subscribe", { method: "POST", body: JSON.stringify(sub.toJSON()) });
  return true;
}

async function disablePush() {
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.getSubscription();
  if (!sub) return;
  await api("/api/push/subscribe", { method: "DELETE", body: JSON.stringify({ endpoint: sub.endpoint }) }).catch(() => {});
  await sub.unsubscribe();
}

async function togglePush() {
  const state = await pushState().catch(() => "unsupported");
  if (state === "unsupported") return alert(t("push.unsupported"));
  if (state === "blocked") return alert(t("push.blocked"));
  try {
    if (state === "on") await disablePush();
    else if (!(await enablePush())) return;
    await paintNotify();
  } catch (err) { fail(err); }
}

async function paintNotify() {
  const btn = $("#notify");
  if (!btn) return;
  const state = await pushState().catch(() => "unsupported");
  const label = state === "on" ? t("push.on") : state === "blocked" ? t("push.blockedShort") : state === "unsupported" ? t("push.unsupportedShort") : t("push.off");
  $("#notify-state").textContent = label;
  $("#notify-action").textContent = state === "on" || state === "off" ? t("push.toggle") : "";
  $("#notify-hint").textContent = t("push.hint");
  btn.setAttribute("aria-pressed", String(state === "on"));
  btn.disabled = state === "unsupported" || state === "blocked";
  btn.onclick = togglePush;
}

/* ---------- profile ---------- */

let meQr = null;
// A file picked but not yet saved is previewed from an object URL; the previous one is revoked so switching files
// does not leak a blob for the life of the page.
let previewUrl = null;
function setPreview(file) {
  if (previewUrl) URL.revokeObjectURL(previewUrl);
  previewUrl = file ? URL.createObjectURL(file) : null;
  meQr = previewUrl;
}

// VietQR (Casso) mints a QR from a bank code, an account and the amount; the extra fields are the transfer
// memo and the account holder. Its bank list says which banks also have an app deeplink, and both are cached
// for a day — the profile field stays free text if the list never arrives.
const VIETQR_IMG = "https://img.vietqr.io/image/";
let banks = null;
async function loadBanks() {
  if (banks) return banks;
  const cached = JSON.parse(localStorage.getItem("banks2") || "null");
  if (cached && Date.now() - cached.at < 864e5) return (banks = cached.list);
  try {
    const [b, a] = await Promise.all([
      fetch("https://api.vietqr.io/v2/banks").then((r) => r.json()),
      fetch("https://api.vietqr.io/v2/android-app-deeplinks").then((r) => r.json()).catch(() => ({})),
    ]);
    const apps = new Map((a.apps ?? []).map((x) => [x.appId.toUpperCase(), x.appId]));
    const list = (b.data ?? []).filter((x) => x.transferSupported).map((x) => ({
      code: x.code,
      name: x.shortName,
      // the deeplink identifies a bank by its app id (`mb`, `icb`, …), not by its bank code
      app: apps.get(x.code.toUpperCase()) ?? null,
      // the Napas id inside a QR payload; parsing a screenshot matches on this
      bin: x.bin,
    }));
    localStorage.setItem("banks2", JSON.stringify({ at: Date.now(), list }));
    return (banks = list);
  } catch {
    return (banks = []);
  }
}

// An uploaded QR screenshot states the account it was made for. Reading it saves retyping the two numbers, but
// only the browsers with BarcodeDetector can (Chrome on Android, iOS 17+); elsewhere the fields stay manual.
// shortcut: no decoder on Firefox and older Safari — add a wasm decoder if that audience matters.
const tlv = (s) => {
  const out = {};
  for (let i = 0; i + 4 <= s.length; ) {
    const len = Number(s.slice(i + 2, i + 4));
    if (!Number.isFinite(len)) break;
    out[s.slice(i, i + 2)] = s.slice(i + 4, i + 4 + len);
    i += 4 + len;
  }
  return out;
};
async function parseQrFile(file, list) {
  if (!("BarcodeDetector" in window)) return null;
  try {
    const [code] = await new BarcodeDetector({ formats: ["qr_code"] }).detect(await createImageBitmap(file));
    // EMVCo: 38 = Napas merchant account info, 38.00 = the AID, 38.01 = its own TLV (00 = bank bin, 01 = account).
    const napas = tlv(tlv(code?.rawValue ?? "")["38"] ?? "");
    if (napas["00"] !== "A000000727") return null;
    const acct = tlv(napas["01"] ?? "");
    const bank = list.find((b) => b.bin === acct["00"]);
    return bank && acct["01"] ? { bank: bank.code, account: acct["01"] } : null;
  } catch {
    return null;
  }
}

// The bank list arrives after the dialog opens; a newer open must not have an older fetch write into it.
let quickpayNonce = 0;
// The code carries nothing but the account and the amount: no memo and no account holder, both of which the
// payer would otherwise have to read past to check the number.
const vietQr = (bank, account, amount) =>
  `${VIETQR_IMG}${encodeURIComponent(bank)}-${encodeURIComponent(account)}-print.png${
    amount ? `?${new URLSearchParams({ amount: String(amount) })}` : ""}`;
// `app` is the app that opens — the payer's own bank, since the money leaves their account; `ba` names the
// beneficiary's account and their bank's app id. Casso's redirect fills the form and hands the app its own scheme.
const bankAppUrl = ({ app, account, bankApp }, amount) =>
  `https://dl.vietqr.io/pay?${new URLSearchParams({
    app, ba: `${account}@${bankApp}`, am: String(amount), url: location.origin,
  })}`;

/* ---------- bank picker ---------- */
// One searchable bank picker, used by the profile and by quick pay: the value is only ever a code from the list,
// and the button always shows the bank's name, never its code. There is no free-text bank anywhere.
// `pool` narrows the choices (quick pay only offers banks that have an app); an empty value is allowed.
function bankPicker(root, { onPick, pool, ariaLabel } = {}) {
  const choices = () => (pool ? pool() : banks) ?? [];
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "picker-btn";
  btn.setAttribute("aria-haspopup", "listbox");
  btn.setAttribute("aria-expanded", "false");
  const pop = document.createElement("div");
  pop.className = "picker-pop hidden";
  pop.innerHTML = `<input type="search" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="true">
    <ul class="picker-list" role="listbox"></ul>`;
  root.append(btn, pop);
  const search = pop.querySelector("input");
  const list = pop.querySelector("ul");
  let value = "";
  let active = 0;
  let hits = [];

  const setAria = () => {
    const label = ariaLabel ? t(ariaLabel) : "";
    if (label) {
      btn.setAttribute("aria-label", label);
      search.setAttribute("aria-label", t("profile.searchBank"));
    }
  };

  const paint = () => {
    const all = choices();
    const seen = all.find((x) => x.code === value);
    btn.innerHTML = seen
      ? esc(seen.name)
      : `<span data-empty>${esc(t(all.length ? "profile.chooseBank" : "profile.bankUnavailable"))}</span>`;
    btn.disabled = !all.length;
    list.innerHTML = hits.length
      ? hits.map((x, i) => `<li role="option" data-code="${esc(x.code)}" aria-selected="${x.code === value}" data-active="${i === active}">${esc(x.name)}</li>`).join("")
      : `<li class="picker-empty">${esc(t("profile.noBankMatch"))}</li>`;
    const on = list.querySelector('[data-active="true"]');
    if (on) on.scrollIntoView({ block: "nearest" });
  };

  const filter = (q) => {
    const needle = q.trim().toLowerCase();
    hits = choices().filter((b) => !needle || b.code.toLowerCase().includes(needle) || b.name.toLowerCase().includes(needle));
    active = 0;
    paint();
  };

  const open = (show) => {
    pop.classList.toggle("hidden", !show);
    btn.setAttribute("aria-expanded", String(show));
    if (!show) return;
    filter("");
    search.value = "";
    search.placeholder = t("profile.searchBank");
    search.focus();
  };

  const pick = (code) => {
    value = choices().some((b) => b.code === code) ? code : "";
    active = Math.max(0, choices().findIndex((b) => b.code === value));
    // Remembered like the scheme and language: the quick-pay picker has no stored bank of its own, so this is what
    // lets it start on the bank the person opened last time.
    if (value) localStorage.setItem("bank", value);
    filter("");
    open(false);
    paint();
    onPick?.(value);
  };

  btn.onclick = () => open(pop.classList.contains("hidden"));
  search.oninput = () => filter(search.value);
  pop.onclick = (e) => {
    const li = e.target.closest("li[data-code]");
    if (li) pick(li.dataset.code);
  };
  search.onkeydown = (e) => {
    if (e.key === "Escape") { e.preventDefault(); open(false); return; }
    if (e.key === "Enter") {
      e.preventDefault();
      if (hits[active]) pick(hits[active].code);
      return;
    }
    if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
    e.preventDefault();
    if (!hits.length) return;
    active = (active + (e.key === "ArrowDown" ? 1 : hits.length - 1)) % hits.length;
    paint();
  };
  document.addEventListener("pointerdown", (e) => {
    if (!pop.classList.contains("hidden") && !root.contains(e.target)) open(false);
  });

  setAria();
  paint();
  return {
    // The list loads asynchronously; `refresh` re-paints once it is in, without inventing a selection.
    refresh() { filter(""); },
    set(code) { pick(code); return value; },
    get value() { return value; },
  };
}

let profileBank;

async function openProfile() {
  const me = await api("/api/me").catch(() => null);
  // `meQr` is the uploaded screenshot and stays the fallback; a stored account owns the QR that is shown.
  meQr = me?.qr ?? null;
  const dlg = $("#profile-dialog");
  dlg.querySelector("[name=name]").value = me?.name ?? "";
  dlg.querySelector("[name=account]").value = me?.account ?? "";
  drawQr(me?.bank, me?.account);
  dlg.showModal();
  autofocusIn(dlg);
  loadBanks().then((list) => {
    banks = list;
    profileBank.set(me?.bank ?? "");
    profileBank.refresh();
  });
}

// The profile preview shows the uploaded image when there is one, and the generated code only when there is not:
// an explicit upload is the person's own choice of what others will scan.
function drawQr(bank, account) {
  const box = $("#qr-preview");
  const generated = bank && account ? vietQr(bank, account, "") : null;
  const src = meQr ?? generated;
  box.innerHTML = src
    ? `<figure><img class="qr-img" src="${esc(src)}" alt="">${
      meQr ? `<button type="button" data-drop-qr="1" title="${esc(t("common.remove"))}">×</button>` : ""}</figure>`
    : `<span class="muted">${esc(t("profile.noQr"))}</span>`;
}

// Reading the screenshot's own payload fills the two fields, so the person does not retype numbers they already
// sent themselves. Off, or unreadable, leaves them as typed.
async function readQrFields(file) {
  const list = await loadBanks();
  const hit = await parseQrFile(file, list);
  if (!hit) return;
  profileBank.set(hit.bank);
  const dlg = $("#profile-dialog");
  dlg.querySelector("[name=account]").value = hit.account;
  drawQr(hit.bank, hit.account);
}

/* ---------- money ---------- */

// The API's balance is payer-credit: positive means you are owed, negative means you owe. On screen the
// direction is a word ("you pay" / "you get back") beside an unsigned amount, so the sign is never printed.
const settledThreshold = 1000;

function balanceChip(balance) {
  if (Math.abs(balance) < settledThreshold) return `<span class="chip">${esc(t("balance.settled"))}</span>`;
  const owes = balance < 0;
  return `<span class="chip ${owes ? "owe" : "owed"}">${esc(t(owes ? "balance.owe" : "balance.owed"))} ${vnd(Math.abs(balance))}</span>`;
}

/* ---------- groups list ---------- */

async function viewGroups() {
  const limit = 5;
  let offset = 0, q = "", total = 0, groups = [];

  const load = async () => {
    const data = await api(`/api/groups?limit=${limit}&offset=${offset}${q ? `&q=${encodeURIComponent(q)}` : ""}`);
    groups = data.groups;
    total = data.total;
    paint();
  };

  function paint() {
    app.innerHTML = `
      <div class="page-head">
        <h1>${esc(t("groups.title"))}</h1>
        <button type="button" class="btn btn-primary" data-new-group="1">${esc(t("groups.new"))}</button>
      </div>
      <form id="search" role="search"><input name="q" type="search" placeholder="${esc(t("groups.search"))}" aria-label="${esc(t("groups.search"))}" value="${esc(q)}"></form>
      <dialog id="group-dialog" aria-labelledby="group-dialog-title">
        <form id="new-group">
          <div class="dialog-head"><h2 id="group-dialog-title">${esc(t("groups.newTitle"))}</h2>
            <button type="button" class="btn btn-quiet" data-close="group-dialog">${esc(t("common.close"))}</button></div>
          <label><span>${esc(t("groups.name"))}</span><input name="name" placeholder="${esc(t("groups.namePlaceholder"))}" data-autofocus required maxlength="80"></label>
          <div class="dialog-foot"><button class="btn btn-primary">${esc(t("groups.create"))}</button></div>
        </form>
      </dialog>
      ${groups.length
        ? `<div class="ledger" style="margin-top:var(--sp-4)">${groups.map((g) => `
          <a class="ledger-row" href="/${g.id}">
            <span class="name">${esc(g.name)}</span>
            <span>${balanceChip(g.myBalance)}</span>
            <span class="note">${esc(t(g.memberCount === 1 ? "groups.members" : "groups.members_plural", { count: g.memberCount }))} · ${esc(date(g.updatedAt))}</span>
          </a>`).join("")}</div>`
        : `<div class="empty">${esc(q ? t("groups.noMatch", { q }) : t("groups.none"))}${q ? "" : `<br><button type="button" class="btn btn-primary" data-new-group="1">${esc(t("groups.new"))}</button>`}</div>`}
      ${total > limit ? `<div class="row" style="justify-content:space-between;margin-top:var(--sp-4)">
        <button type="button" class="btn" data-page="prev" ${offset === 0 ? "disabled" : ""}>${esc(t("groups.newer"))}</button>
        <span class="muted num">${esc(t("groups.pager", { from: offset + 1, to: Math.min(offset + limit, total), total }))}</span>
        <button type="button" class="btn" data-page="next" ${offset + limit >= total ? "disabled" : ""}>${esc(t("groups.older"))}</button>
      </div>` : ""}`;

    $("#search").onsubmit = (e) => { e.preventDefault(); q = e.target.elements.q.value.trim(); offset = 0; load(); };
    $("#new-group").onsubmit = async (e) => {
      e.preventDefault();
      const name = e.target.elements.name.value.trim();
      if (!name) return;
      try { const g = await api("/api/groups", { method: "POST", body: JSON.stringify({ name }) }); location.href = `/${g.id}`; }
      catch (err) { fail(err); }
    };
    app.onclick = async (e) => {
      const el = e.target.closest("[data-new-group], [data-page]");
      if (!el) return;
      if (el.dataset.newGroup) {
        $("#new-group").reset();
        const gd = $("#group-dialog");
        gd.showModal();
        autofocusIn(gd);
      }
      else if (el.dataset.page) {
        offset = Math.max(0, el.dataset.page === "next" ? offset + limit : offset - limit);
        await load();
      }
    };
  }

  await load();
}

/* ---------- group ---------- */

async function viewGroup(id) {
  app.innerHTML = `<div class="stack" aria-busy="true">
    <div class="skeleton" style="width:40%"></div><div class="skeleton" style="width:70%"></div><div class="skeleton"></div></div>`;
  // One request carries the group, both lists and the balances, so an edit costs one round trip.
  const data = await api(`/api/groups/${id}/view`);
  const group = data;
  const { bills, payments, summary } = data;
  if (data.myName) { meName = data.myName; $("#me").textContent = data.myName; }
  meEmail = data.me;
  if (meEmail) $("#who").textContent = meEmail;
  const members = group.members;
  const me = group.me;
  const nameOf = new Map(members.map((m) => [m.email, m.name]));
  const who = (email) => nameOf.get(email) ?? email;

  // A weight multiplies the base share, so the price to quote is one unit: the amount over the total weight.
  // A weight-2 person pays twice that, but "each" still names what a weight-1 person pays.
  function eachText(b) {
    const weights = Object.values(b.weights ?? {});
    const total = weights.length ? weights.reduce((a, w) => a + w, 0) : b.participants.length;
    if (!total) return "";
    return t("group.each", { amount: vnd(Math.floor(b.amount / total)) });
  }

  // A fold is one quiet line until opened. It carries the count, so nothing disappears silently.
  function fold(label, html) {
    return `<details class="fold"><summary>${esc(label)}</summary>${html}</details>`;
  }

  function balanceRow(b) {
    const settled = Math.abs(b.balance) < settledThreshold;
    const owes = b.balance < 0;
    // the verb is third person for everyone: your row is identified by the tag beside the name, not by a
    // different sentence, so the amounts line up and scan the same way
    const verb = owes ? "balance.owes" : "balance.owedTo";
    return `<div class="balance-row">
          <button type="button" class="btn btn-quiet" style="justify-self:start;min-height:32px;padding:0" data-qr="${esc(b.email)}">${esc(b.name)}${
            b.email === me ? ` <span class="chip">${esc(t("members.you"))}</span>` : ""
          }</button>
          <span class="balance-figures">
            <span class="row" style="justify-content:flex-end;gap:var(--sp-2)">
              ${settled ? "" : `<span class="muted">${esc(t(verb))}</span>`}
              <span class="money ${settled ? "settled" : owes ? "owe" : "owed"}">${settled ? esc(t("balance.settled")) : vnd(Math.abs(b.balance))}</span>
            </span>
            <span class="muted num">${esc(t("group.spent", { amount: vnd(b.spent ?? 0) }))}</span>
          </span>
        </div>`;
  }

  function balancesBlock(rows) {
    const mine = rows.find((b) => b.email === me);
    const others = rows.filter((b) => b.email !== me);
    const open = others.filter((b) => Math.abs(b.balance) >= settledThreshold);
    const settled = others.filter((b) => Math.abs(b.balance) < settledThreshold);
    return `${mine ? balanceRow(mine) : ""}${open.map(balanceRow).join("")}${
      settled.length ? fold(t("group.settledRows", { count: settled.length }), settled.map(balanceRow).join("")) : ""}`;
  }

  function settlementBlock(settlements) {
    if (!settlements.length) return `<p class="muted">${esc(t("group.allSettled"))}</p>`;
    const row = (s) => `<div class="settlement">
            <span class="settlement-names">${esc(s.fromName)} → ${esc(s.toName)}</span>
            <span class="money settlement-amount">${vnd(s.amount)}</span>
            <button type="button" class="btn" data-quickpay="${esc(s.from)}" data-payee="${esc(s.to)}" data-amount="${s.amount}">${
              esc(t(s.from === me ? "quickpay.pay" : "quickpay.receive"))
            }</button>
          </div>`;
    const mine = settlements.filter((s) => s.from === me || s.to === me);
    const others = settlements.filter((s) => s.from !== me && s.to !== me);
    return `<div class="settlements">${mine.map(row).join("")}${
      others.length ? fold(t("group.otherTransfers", { count: others.length }), others.map(row).join("")) : ""}</div>`;
  }

  app.innerHTML = `
    <div class="page-head page-head--group">
      <div class="title-row">
        <h1 id="gname">${esc(group.name)}</h1>
        <button type="button" class="btn icon-btn" id="rename" title="${esc(t("group.rename"))}" aria-label="${esc(t("group.rename"))}">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 20h4l10-10a2.8 2.8 0 0 0-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>
        </button>
      </div>
      <div class="row head-actions">
        <button type="button" class="btn" data-members="1">${esc(t("group.members", { count: members.length }))}</button>
      </div>
    </div>

    <dialog id="rename-dialog" aria-labelledby="rename-title">
      <form id="rename-form">
        <div class="dialog-head"><h2 id="rename-title">${esc(t("group.rename"))}</h2>
          <button type="button" class="btn btn-quiet" data-close="rename-dialog">${esc(t("common.close"))}</button></div>
        <div class="dialog-body">
          <label><span>${esc(t("groups.name"))}</span><input name="name" maxlength="80" required data-autofocus value="${esc(group.name)}"></label>
        </div>
        <div class="dialog-foot"><button class="btn btn-primary">${esc(t("common.save"))}</button></div>
      </form>
    </dialog>

    <section class="summary" aria-labelledby="summary-title">
      <h2 id="summary-title">${esc(t("group.summary"))}</h2>
      <div class="summary-total">
        <span class="muted">${esc(t("group.totalSpent"))}</span>
        <span class="amount num">${vnd(summary.totalSpent)}</span>
      </div>
      <div class="balances">${balancesBlock(summary.balances)}</div>
    </section>

    <section class="summary" aria-labelledby="settle-title">
      <h2 id="settle-title">${esc(t("group.settleUp"))}</h2>
      ${settlementBlock(summary.settlements)}
    </section>

    <div class="tabs" role="tablist">
      <button type="button" class="tab" role="tab" id="tab-bills" aria-controls="panel-bills" aria-selected="true">${esc(t("group.bills"))} <span class="num">${bills.length}</span></button>
      <button type="button" class="tab" role="tab" id="tab-payments" aria-controls="panel-payments" aria-selected="false">${esc(t("group.payments"))} <span class="num">${payments.length}</span></button>
    </div>

    <section id="panel-bills" role="tabpanel" aria-labelledby="tab-bills">
      <div class="row" style="justify-content:flex-end;margin-bottom:var(--sp-3)">
        <button type="button" class="btn btn-primary" data-new-bill="1">${esc(t("group.addBill"))}</button>
      </div>
      ${bills.length ? billList(bills) : `<div class="empty">${esc(t("group.noBills"))}</div>`}
    </section>

    <section id="panel-payments" role="tabpanel" aria-labelledby="tab-payments" class="hidden">
      <div class="row" style="justify-content:flex-end;margin-bottom:var(--sp-3)">
        <button type="button" class="btn btn-primary" data-new-pay="1">${esc(t("group.addPayment"))}</button>
      </div>
      ${payments.length ? paymentList(payments) : `<div class="empty">${esc(t("group.noPayments"))}</div>`}

    <dialog id="members-dialog" aria-labelledby="members-title">
      <div class="dialog-head"><h2 id="members-title">${esc(t("members.title"))}</h2>
        <button type="button" class="btn btn-quiet" data-close="members-dialog">${esc(t("common.close"))}</button></div>
      <ul class="member-list">${members.map((m) => `<li>
        <span class="member-name">${esc(m.name)}${m.name === m.email ? "" : ` <span class="muted">${esc(m.email)}</span>`}${m.email === me ? ` <span class="chip">${esc(t("members.you"))}</span>` : ""}</span>
        ${m.email === me
          ? `<button type="button" class="btn btn-quiet btn-danger member-remove" data-leave-group="1"
              aria-label="${esc(t("members.leave"))}" title="${esc(t("members.leave"))}">${esc(t("members.leaveShort"))}</button>`
          : `<button type="button" class="btn btn-quiet btn-danger member-remove" data-remove-member="${esc(m.email)}"
              aria-label="${esc(t("members.remove", { name: m.name }))}" title="${esc(t("members.remove", { name: m.name }))}">${esc(t("members.removeShort"))}</button>`}
      </li>`).join("")}</ul>
      <div class="stack">
        <label><span>${esc(t("members.inviteLink"))}</span><input id="invite-link" readonly value="${esc(location.origin + "/join/" + group.inviteToken)}"></label>
        <div class="row"><button type="button" class="btn" id="copy-invite">${esc(t("members.copy"))}</button>
          <button type="button" class="btn btn-quiet" id="rotate-invite">${esc(t("members.rotate"))}</button></div>
        <p class="muted">${esc(t("members.rotateHint"))}</p>
      </div>
      <form id="invite" style="margin-top:var(--sp-4)"><div class="row">
        <input name="email" type="email" placeholder="${esc(t("members.emailPlaceholder"))}" aria-label="${esc(t("members.invite"))}" data-autofocus required style="flex:1;min-width:180px">
        <button class="btn btn-primary">${esc(t("members.invite"))}</button>
      </div></form>
      <div class="danger-zone">
        <button type="button" class="btn btn-danger" id="del-group">${esc(t("group.delete"))}</button>
        <span class="muted">${esc(t("group.deleteHint"))}</span>
      </div>
    </dialog>

    <dialog id="bill-dialog" aria-labelledby="bill-title">
      <form id="bill-form">
        <div class="dialog-head"><h2 id="bill-title">${esc(t("bill.add"))}</h2>
          <button type="button" class="btn btn-quiet" data-close="bill-dialog">${esc(t("common.close"))}</button></div>
        <input type="hidden" name="id">
        <label><span>${esc(t("bill.description"))}</span><input name="title" placeholder="${esc(t("bill.descriptionPlaceholder"))}" data-autofocus maxlength="200"></label>
        <label><span>${esc(t("bill.amount"))}</span><input name="amount" type="text" inputmode="numeric" autocomplete="off" placeholder="${esc(t("bill.amountPlaceholder"))}" required></label>
        <label><span>${esc(t("bill.paidBy"))}</span><select name="paidBy">${members.map((m) => `<option value="${esc(m.email)}">${esc(m.name)}</option>`).join("")}</select></label>
        <fieldset class="fieldset">
          <legend>${esc(t("bill.involved"))}</legend>
          <p class="muted" style="font-size:var(--text-xs)">${esc(t("bill.weightHint"))}</p>
          ${members.map((m) => `<div class="weight-row">
            <label class="check"><input type="checkbox" name="participants" value="${esc(m.email)}" checked> ${esc(m.name)}</label>
            <span class="stepper">
              <button type="button" class="step" data-step="-1" data-for="${esc(m.email)}" aria-label="${esc(t("bill.weightDown"))}" tabindex="-1">−</button>
              <input type="number" name="weight" data-for="${esc(m.email)}" min="1" step="1" value="1" inputmode="numeric" aria-label="${esc(t("bill.weight"))} — ${esc(m.name)}">
              <button type="button" class="step" data-step="1" data-for="${esc(m.email)}" aria-label="${esc(t("bill.weightUp"))}" tabindex="-1">+</button>
            </span>
          </div>`).join("")}
        </fieldset>
        <label><span>${esc(t("bill.image"))}</span><input name="file" type="file" accept="image/*"></label>
        <div class="thumbs" id="bill-thumbs"></div>
        <div class="dialog-foot">
          <button type="button" class="btn btn-danger hidden" data-del-bill="" id="bill-delete">${esc(t("common.delete"))}</button>
          <button class="btn btn-primary">${esc(t("bill.save"))}</button>
        </div>
      </form>
    </dialog>

    <dialog id="pay-dialog" aria-labelledby="pay-title">
      <form id="pay-form">
        <div class="dialog-head"><h2 id="pay-title">${esc(t("payment.add"))}</h2>
          <button type="button" class="btn btn-quiet" data-close="pay-dialog">${esc(t("common.close"))}</button></div>
        <input type="hidden" name="id">
        <label><span>${esc(t("payment.from"))}</span><select name="from">${members.map((m) => `<option value="${esc(m.email)}">${esc(m.name)}</option>`).join("")}</select></label>
        <label><span>${esc(t("payment.to"))}</span><select name="to">${members.map((m) => `<option value="${esc(m.email)}">${esc(m.name)}</option>`).join("")}</select></label>
        <label><span>${esc(t("bill.amount"))}</span><input name="amount" type="text" inputmode="numeric" autocomplete="off" placeholder="${esc(t("bill.amountPlaceholder"))}" required></label>
        <label><span>${esc(t("payment.image"))}</span><input name="file" type="file" accept="image/*"></label>
        <div class="thumbs" id="pay-thumbs"></div>
        <div class="dialog-foot">
          <button type="button" class="btn btn-danger hidden" data-del-pay="" id="pay-delete">${esc(t("common.delete"))}</button>
          <button class="btn btn-primary">${esc(t("payment.save"))}</button>
        </div>
      </form>
    </dialog>

    <dialog id="quickpay-dialog" aria-labelledby="quickpay-title">
      <div class="dialog-head dialog-head--actions">
        <h2 id="quickpay-title"></h2>
        <span class="row">
          <button type="button" class="btn" data-close="quickpay-dialog">${esc(t("common.cancel"))}</button>
          <button type="button" class="btn btn-primary" id="quickpay-done">${esc(t("quickpay.done"))}</button>
        </span>
      </div>
      <div class="dialog-body">
        <div class="summary-total">
          <span class="muted">${esc(t("detail.amount"))}</span>
          <span class="amount num" id="quickpay-amount"></span>
        </div>
        <div id="quickpay-qr"></div>
        <div id="quickpay-app" class="row" style="justify-content:center"></div>
        <p class="muted" id="quickpay-hint"></p>
      </div>
    </dialog>

    <dialog id="detail-dialog" aria-labelledby="detail-title">
      <div class="dialog-head"><h2 id="detail-title"></h2>
        <button type="button" class="btn btn-quiet" data-close="detail-dialog">${esc(t("common.close"))}</button></div>
      <div id="detail-body" class="stack"></div>
    </dialog>
  `;

  const thumbHTML = (key) => (key ? `<figure><img src="/img/${key}" alt=""><button type="button" data-remove="${esc(key)}" title="${esc(t("common.remove"))}">×</button></figure>` : "");
  const state = { billImage: null, payImage: null, billId: null, payId: null };

  function drawThumbs(which) {
    $(`#${which}-thumbs`).innerHTML = thumbHTML(which === "bill" ? state.billImage : state.payImage);
  }

  const billForm = $("#bill-form"), payForm = $("#pay-form");

  // Amount fields group digits per locale; the input still sends the bare integer.
  const digits = (value) => value.replace(/\D/g, "").replace(/^0+(?=\d)/, "");
  const amountValue = (input) => Number(input.value.replace(/\D/g, ""));
  const formatAmount = (input) => {
    const d = digits(input.value);
    input.value = d ? nf().format(Number(d)) : "";
  };
  for (const input of [billForm.elements.amount, payForm.elements.amount]) {
    input.oninput = () => formatAmount(input);
  }

  const boxes = () => $$('input[name="participants"]', billForm);

  // Weights are whole numbers from 1 up: 1 is an even share, 2 pays double. The stepper and the native
  // arrow keys both move by one, and a typed value is clamped on the way out.
  const clampWeight = (v) => Math.max(1, Math.round(Number(v) || 1));
  const weightOf = (email) => clampWeight($(`input[name="weight"][data-for="${CSS.escape(email)}"]`, billForm).value);

  // A weight only means something for a checked person, so an unchecked row disables its field.
  function syncWeights() {
    for (const box of boxes()) {
      const field = $(`input[name="weight"][data-for="${CSS.escape(box.value)}"]`, billForm);
      field.disabled = !box.checked;
      for (const step of $$(`.step[data-for="${CSS.escape(box.value)}"]`, billForm)) step.disabled = !box.checked;
      field.closest(".weight-row").style.opacity = box.checked ? "1" : "0.55";
    }
  }
  for (const box of boxes()) box.onchange = syncWeights;

  billForm.addEventListener("click", (e) => {
    const step = e.target.closest(".step");
    if (!step) return;
    const field = $(`input[name="weight"][data-for="${CSS.escape(step.dataset.for)}"]`, billForm);
    field.value = String(clampWeight(Number(field.value) + Number(step.dataset.step)));
  });
  billForm.addEventListener("change", (e) => {
    if (e.target.name !== "weight") return;
    e.target.value = String(clampWeight(e.target.value));
  });

  function setParticipants(values, weights) {
    for (const box of boxes()) {
      box.checked = values.includes(box.value);
      $(`input[name="weight"][data-for="${CSS.escape(box.value)}"]`, billForm).value = String(weights?.[box.value] ?? 1);
    }
    syncWeights();
  }

  function resetBill() {
    billForm.reset();
    billForm.elements.id.value = "";
    $("#bill-title").textContent = t("bill.add");
    setParticipants(members.map((m) => m.email), null);
    state.billImage = null;
    state.billId = newId();
    drawThumbs("bill");
    const del = $("#bill-delete");
    del.dataset.delBill = "";
    del.classList.add("hidden");
    const billDialog = $("#bill-dialog");
    billDialog.showModal();
    autofocusIn(billDialog);
  }

  billForm.onsubmit = async (e) => {
    e.preventDefault();
    const f = billForm;
    const picked = boxes().filter((b) => b.checked).map((b) => b.value);
    if (!picked.length) return alert(t("common.pickParticipant"));
    try {
      const file = f.elements.file.files[0];
      state.billId ||= newId();
      const image = file ? await uploadImage(id, "bills", state.billId, file) : state.billImage;
      const body = {
        id: state.billId,
        title: f.elements.title.value,
        amount: amountValue(f.elements.amount),
        paidBy: f.elements.paidBy.value,
        weights: Object.fromEntries(picked.map((p) => [p, weightOf(p)])),
        image,
      };
      if (f.elements.id.value) await api(`/api/groups/${id}/bills/${f.elements.id.value}`, { method: "PATCH", body: JSON.stringify(body) });
      else await api(`/api/groups/${id}/bills`, { method: "POST", body: JSON.stringify(body) });
      await render();
    } catch (err) { fail(err); }
  };

  // A missing QR renders as a note, never a broken image.
  function showQr(m) {
    if (!m) return;
    const dlg = $("#qr-dialog");
    $("#qr-title").textContent = m.name;
    $("#qr-view").innerHTML = m.qr
      ? `<img class="qr-img" src="${esc(m.qr)}" alt="">`
      : `<span class="muted">${esc(t("common.noQr"))}</span>`;
    dlg.showModal();
  autofocusIn(dlg);
  }

  function editBill(b) {
    billForm.elements.id.value = b.id;
    billForm.elements.title.value = b.title;
    billForm.elements.amount.value = nf().format(Number(b.amount));
    billForm.elements.paidBy.value = b.paidBy;
    setParticipants(b.participants, b.weights);
    state.billId = b.id;
    state.billImage = b.image;
    drawThumbs("bill");
    const del = $("#bill-delete");
    del.dataset.delBill = b.id;
    del.classList.remove("hidden");
    $("#bill-title").textContent = t("bill.edit");
    const billDialog = $("#bill-dialog");
    billDialog.showModal();
    autofocusIn(billDialog);
  }

  // The whole card is the edit affordance; the pencil beside the title is the keyboard-reachable control
  // for it, so the card itself needs no tabindex and no role on a container that holds other buttons.

  function billCard(b) {
    const involved = b.participants.includes(me);
    // green edge: you paid it (green wins when both apply); red edge: you are in but did not pay
    const accent = b.paidBy === me ? " card--paid" : involved ? " card--involved" : "";
    const each = eachText(b);
    return `<article class="card card--clickable${accent}" data-details-bill="${b.id}">
      <div class="card-head">
        <h3>${esc(b.title || t("detail.title"))}<button type="button" class="btn icon-btn card-edit" data-edit-bill="${b.id}" aria-label="${esc(t("common.edit"))}" title="${esc(t("common.edit"))}">${editIcon}</button></h3>
        <span class="money">${vnd(b.amount)}</span>
      </div>
      <div class="card-meta">
        <span class="card-meta-info">
          <span>${esc(b.paidBy === me ? t("group.youPaid") : t("group.paid", { name: who(b.paidBy) }))}</span>
          <span>${esc(t("group.involved", { count: b.participants.length }))}</span>
          <span>${esc(date(b.createdAt))}</span>
        </span>
        ${each ? `<span class="card-each num">${esc(each)}</span>` : ""}
      </div>
    </article>`;
  }

  // Bills you are not in are noise in the list: one closed fold, in place, keeps the order intact.
  function billList(list) {
    const mine = list.filter((b) => b.participants.includes(me) || b.paidBy === me);
    const others = list.filter((b) => !b.participants.includes(me) && b.paidBy !== me);
    return `${mine.map(billCard).join("")}${
      others.length ? fold(t("group.uninvolvedBills", { count: others.length }), others.map(billCard).join("")) : ""}`;
  }

  function paymentList(list) {
    const mine = list.filter((p) => p.from === me || p.to === me);
    const others = list.filter((p) => p.from !== me && p.to !== me);
    return `${mine.map(paymentCard).join("")}${
      others.length ? fold(t("group.uninvolvedPayments", { count: others.length }), others.map(paymentCard).join("")) : ""}`;

  function paymentCard(p) {
    return `<article class="card card--clickable" data-details-pay="${p.id}">
      <div class="card-head">

      if (f.elements.id.value) await api(`/api/groups/${id}/payments/${f.elements.id.value}`, { method: "PATCH", body: JSON.stringify(body) });

  /* tabs */

  $("#tab-bills").onclick = () => selectTab("bills");

    tab.onkeydown = (e) => {
      if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;

  // Quick pay: show the payee's QR, then record the transfer the transfer list already named.
  // Cancel closes without a request; Done writes one payment and repaints from the server.
  function openQuickPay(from, to, amount) {
    const payer = members.find((x) => x.email === from);
    const payee = members.find((x) => x.email === to);
    if (!payer || !payee) return;
    const iAmPayer = from === me;
    const minted = payee.bank && payee.account;
    $("#quickpay-title").textContent = iAmPayer
      ? t("quickpay.title", { name: payee.name })
      : t("quickpay.receiveTitle", { name: payer.name });
    $("#quickpay-amount").textContent = vnd(amount);
    // The amount is the only thing the code adds: no memo, no holder name — the payer reads the number and sends it.
    // A stored account always wins over an uploaded screenshot; that image is only shown if VietQR cannot draw
    // this code, which is the one case it is still useful.
    const box = $("#quickpay-qr");
    const noQr = () => {
      box.innerHTML = `<p class="muted">${esc(iAmPayer ? t("common.noQr") : t("quickpay.noQrSelf"))}</p>`;
    };
    const manual = () => {
      if (!payee.qr) return noQr();
      const img = new Image();
      img.className = "qr-img";
      img.alt = "";
      img.onerror = noQr;
      img.src = payee.qr;
      box.replaceChildren(img);
    };
    if (!minted) manual();
    else {
      const img = new Image();
      img.className = "qr-img";
      img.alt = "";
      img.onerror = manual;
      img.src = vietQr(payee.bank, payee.account, amount);
      box.replaceChildren(img);
    }
    // The app that must open is the payer's own bank, since the money leaves their account; the beneficiary is
    // the payee. The same picker as the profile shows bank names, and only lists banks with an app — so a code that
    // cannot open is never offered, and nothing is preselected unless it is the payer's own stored bank.
    // Confirming as the payee has nothing to open either: they scan, they do not pay.
    const appBox = $("#quickpay-app");
    appBox.innerHTML = "";
    if (iAmPayer && minted) {
      const nonce = ++quickpayNonce;
      loadBanks().then((list) => {
        if (nonce !== quickpayNonce) return;
        const theirs = list.find((b) => b.app && b.code.toUpperCase() === String(payee.bank).toUpperCase());
        if (!theirs) return; // the payee's bank has no deeplink: scanning is the only route
        const mine = list.find((b) => b.app && b.code.toUpperCase() === String(payer.bank).toUpperCase());
        const wrap = document.createElement("div");
        wrap.className = "picker";
        const go = document.createElement("a");
        go.className = "btn btn-primary";
        go.textContent = t("quickpay.openApp");
        appBox.append(wrap, go);
        const href = (b) => bankAppUrl({ app: b.app, account: payee.account, bankApp: theirs.app }, amount);
        const setHref = (code) => {
          const b = list.find((x) => x.app && x.code === code);
          go.classList.toggle("hidden", !b);
          if (b) go.href = href(b);
        };
        const picker = bankPicker(wrap, { pool: () => list.filter((b) => b.app), onPick: setHref, ariaLabel: "quickpay.pickBank" });
        // Their stored bank first; otherwise the one they opened for a quick pay last time. `set` blanks a code
        // that is no longer in the list, so a bank that lost its app just leaves the choice empty.
        picker.set(mine?.code || localStorage.getItem("bank") || "");
        setHref(picker.value);
      });
    }
    $("#quickpay-hint").textContent = t(iAmPayer ? "quickpay.hint" : "quickpay.receiveHint");
    const done = $("#quickpay-done");
    done.disabled = false;
    done.textContent = t("quickpay.done");
    done.onclick = async () => {
      done.disabled = true;
      done.textContent = t("quickpay.recording");
      try {
        await api(`/api/groups/${id}/payments`, {
          method: "POST",
          body: JSON.stringify({ id: newId(), from, to, amount }),
        });
        $("#quickpay-dialog").close();
        await render();
      } catch (err) {
        done.disabled = false;
        done.textContent = t("quickpay.done");
        fail(err);
      }
    };
    const qp = $("#quickpay-dialog");
    qp.showModal();
    autofocusIn(qp);
  }

  app.onclick = async (e) => {
    // The whole card opens Details; only the pencil beside the description opens the editor. The click
    // resolves to the innermost matching element so a button inside a card wins over the card itself.
    const el = e.target.closest("button, [data-details-bill], [data-details-pay], [data-edit-bill], [data-edit-pay]");
    if (!el) return;
    const d = el.dataset;
    // a card opened from the keyboard is a button-like target: Enter on the pencil already handles it
    if (d.quickpay) { openQuickPay(d.quickpay, d.payee, Number(d.amount)); return; }
    if (d.members) {
      const membersDlg = $("#members-dialog");
      membersDlg.showModal();
      autofocusIn(membersDlg);
      return;
    }
    if (d.leaveGroup) {
      if (!confirm(t("members.leaveConfirm", { name: group.name }))) return;
      await api(`/api/groups/${id}/members/${encodeURIComponent(me)}`, { method: "DELETE" });
      location.href = "/";
      return;
    }
    if (d.removeMember) {
      if (!confirm(t("members.removeConfirm", { name: d.removeMember }))) return;
      await api(`/api/groups/${id}/members/${encodeURIComponent(d.removeMember)}`, { method: "DELETE" });
      await render();
      return;
    }
    if (d.newBill) return resetBill();
    if (d.newPay) return resetPay();
    if (d.editBill) return editBill(bills.find((b) => b.id === d.editBill));
    if (d.editPay) return editPay(payments.find((p) => p.id === d.editPay));
    try {
      if (d.detailsBill) {
        const b = bills.find((x) => x.id === d.detailsBill);
        const rows = b.participants.map((p) => {
          const w = b.weights?.[p];
          const share = b.shares?.[p];
          return `<li class="share-row"><span>${esc(who(p))}${w && w !== 1 ? ` <span class="chip">×${esc(w)}</span>` : ""}${
            p === me ? ` <span class="chip">${esc(t("members.you"))}</span>` : ""
          }</span>${
            share === undefined ? "" : `<span class="money">${vnd(share)}</span>`
          }</li>`;
        }).join("");
        showDetails(b.title || t("detail.title"), [
          `${esc(t("detail.amount"))}: <span class="money">${vnd(b.amount)}</span>`,
          `${esc(t("detail.paidBy"))}: ${esc(who(b.paidBy))}`,
          `<div>${esc(t("detail.involved", { count: b.participants.length }))}</div><ul class="share-list">${rows}</ul>`,
          `<span class="muted">${esc(dateTime(b.createdAt))}</span>`,
        ], b.image);
      } else if (d.detailsPay) {
        const p = payments.find((x) => x.id === d.detailsPay);
        showDetails(`${who(p.from)} → ${who(p.to)}`, [
          `${esc(t("detail.amount"))}: <span class="money">${vnd(p.amount)}</span>`,
          `<span class="muted">${esc(dateTime(p.createdAt))}</span>`,
        ], p.image);
      } else if (d.qr) showQr(members.find((m) => m.email === d.qr));
      else if (d.remove) {
        if (state.billImage === d.remove) { state.billImage = null; drawThumbs("bill"); }
        else { state.payImage = null; drawThumbs("pay"); }
      } else if (d.delBill) {
        if (!confirm(t("common.deleteBill"))) return;
        await api(`/api/groups/${id}/bills/${d.delBill}`, { method: "DELETE" });
        await render();
      } else if (d.delPay) {
        if (!confirm(t("common.deletePayment"))) return;
        await api(`/api/groups/${id}/payments/${d.delPay}`, { method: "DELETE" });
        await render();
      }
    } catch (err) { fail(err); }
  };

  const linkInput = $("#invite-link");
  $("#copy-invite").onclick = async () => {
    try { await navigator.clipboard.writeText(linkInput.value); }
    catch { linkInput.select(); document.execCommand("copy"); }
    const btn = $("#copy-invite");
    btn.textContent = t("members.copied");
    setTimeout(() => { if (btn.isConnected) btn.textContent = t("members.copy"); }, 1200);
  };

  $("#rotate-invite").onclick = async () => {
    try {
      const { inviteToken } = await api(`/api/groups/${id}/invite`, { method: "POST" });
      linkInput.value = `${location.origin}/join/${inviteToken}`;
    } catch (err) { fail(err); }
  };

  $("#invite").onsubmit = async (e) => {
    e.preventDefault();
    try {
      await api(`/api/groups/${id}/members`, { method: "POST", body: JSON.stringify({ email: e.target.elements.email.value }) });
      await render();
    } catch (err) { fail(err); }
  };

  $("#rename").onclick = () => {
    const renameDlg = $("#rename-dialog");
    renameDlg.showModal();
    autofocusIn(renameDlg);
  };

  $("#rename-form").onsubmit = async (e) => {
    e.preventDefault();
    const name = e.target.elements.name.value.trim();
    if (!name) return;
    try {
      const { name: saved } = await api(`/api/groups/${id}`, { method: "PATCH", body: JSON.stringify({ name }) });
      $("#rename-dialog").close();
      group.name = saved;
      $("#gname").textContent = saved;
    } catch (err) { fail(err); }
  };

  $("#del-group").onclick = async () => {
    if (!confirm(t("group.deleteConfirm", { name: group.name }))) return;
    try { await api(`/api/groups/${id}`, { method: "DELETE" }); location.href = "/"; }
    catch (err) { fail(err); }
  };
}

const SCHEME_LABEL = (id) => t("scheme." + id);

// A scheme option previews itself: its paper, a mid tone, its ink and its signal, read off a probe element
// once. Both the background AND the ink come from the option's own scheme, or a dark option would print
// dark ink on dark paper whenever the current scheme is light.
const schemeCache = new Map();
function schemeTokens(id) {
  if (!schemeCache.has(id)) {
    const probe = document.createElement("div");
    probe.dataset.scheme = id;
    probe.style.cssText = "position:absolute;visibility:hidden";
    document.body.append(probe);
    const cs = getComputedStyle(probe);
    const read = (k) => cs.getPropertyValue(k).trim() || "transparent";
    schemeCache.set(id, { paper: read("--paper"), swatches: ["--paper", "--sunken", "--ink", "--owe"].map(read), ink: read("--ink"), owe: read("--owe") });
    probe.remove();
  }
  return schemeCache.get(id);
}

function paintSettings() {
  $("#scheme-grid").innerHTML = SCHEMES.map((s) => `
    <button type="button" class="scheme-opt" data-scheme-id="${s.id}" aria-pressed="${s.id === scheme}"
      style="background:${schemeTokens(s.id).paper};color:${schemeTokens(s.id).ink};--opt-ink:${schemeTokens(s.id).ink}">
      <span class="swatches" aria-hidden="true">${schemeTokens(s.id).swatches.map((c) => `<span style="background:${c}"></span>`).join("")}</span>
      <span>${esc(SCHEME_LABEL(s.id))}</span>
    </button>`).join("");
  $("#lang-list").innerHTML = LANGUAGES.map((l) => `
    <button type="button" class="btn lang-opt" data-lang="${l.code}" aria-pressed="${l.code === lang}">
      <span>${esc(l.label)}</span><span class="muted">${l.code === DEFAULT_LANG ? esc(t("settings.default")) : ""}</span>
    </button>`).join("");
  $("#scheme-grid").onclick = (e) => {
    const btn = e.target.closest("[data-scheme-id]");
    if (!btn) return;
    applyScheme(btn.dataset.schemeId);
    paintSettings();
  };
  $("#lang-list").onclick = (e) => {
    const btn = e.target.closest("[data-lang]");
    if (!btn) return;
    applyLang(btn.dataset.lang);
    paintSettings();
  };
}

function openSettings() {
  paintSettings();
  const dlg = $("#settings-dialog");
  dlg.showModal();
  autofocusIn(dlg);
}

$("#profile-form").onsubmit = async (e) => {
  e.preventDefault();
  const f = e.target;
  try {
    const name = f.elements.name.value.trim();
    if (!name) return alert(t("error.name"));
    const file = f.elements.qr.files[0];
    // Reading the payload only fills the account fields; the image itself is still the upload that gets stored.
    if (file) await readQrFields(file);
    const bank = profileBank.value;
    const account = f.elements.account.value.trim();
    const saved = await api("/api/me", { method: "PATCH", body: JSON.stringify({ name, bank, account }) });
    // An upload is kept even when an account is set: the profile shows the image, and only falls back to the
    // generated code when there is none.
    if (file) {
      const fd = new FormData();
      fd.append("file", file);
      meQr = (await api("/api/me/qr", { method: "POST", body: fd })).qr;
    } else meQr = saved.qr;
    setPreview(null);
    meName = name;
    $("#me").textContent = name;
    f.elements.qr.value = "";
    $("#profile-dialog").close();
    await render();
  } catch (err) { fail(err); }
};

$("#profile-dialog").addEventListener("change", (e) => {

    // preview matches what saving will store, not a code built from the account fields beside it.
    setPreview(e.target.files[0]);
    drawQr(profileBank.value, $("#profile-form").elements.account.value.trim());
    readQrFields(e.target.files[0]).catch(() => {});
    return;
  }
  // Editing the account must drop or refresh the generated preview at once, not only after a save.
  if (e.target.name === "account") drawQr(profileBank.value, e.target.value.trim());
});

    if (err.message !== "unauthenticated") app.innerHTML = `<p class="error">${esc(errorText(err.message))}</p>`;
  }
}

// Backdrop tap closes a dialog. Track where the press started so a drag
// selection that ends over the backdrop does not close it.
let pressedBackdrop = null;
document.addEventListener("pointerdown", (e) => {
  const d = e.target;
  if (!(d instanceof HTMLDialogElement)) { pressedBackdrop = null; return; }
  const r = d.getBoundingClientRect();
  pressedBackdrop = e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom ? d : null;
});
document.addEventListener("click", (e) => {
  // A receipt or QR is shown at reading size in place; one click expands it to the dialog's height.
  if (e.target.classList?.contains("qr-img")) { e.target.classList.toggle("qr-img--full"); return; }
  // Dialogs live both inside #app and in static markup, so close here, not per view.
  const closer = e.target.closest?.("[data-close]");
  if (closer) $("#" + closer.dataset.close)?.close();
  if (pressedBackdrop && e.target === pressedBackdrop) pressedBackdrop.close();
  pressedBackdrop = null;
});

// Shortcuts act on what is on screen; a dialog or a text field keeps its own keys.
document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const typing = e.target instanceof HTMLElement && (e.target.closest("input, select, textarea, dialog") && e.key !== "Escape");
  if (e.key === "Escape") return; // native dialog close
  if (typing) return;
  if (e.key === "?") { e.preventDefault(); openSettings(); }
  else if (e.key === "t") {
    e.preventDefault();
    const i = SCHEMES.findIndex((s) => s.id === scheme);
    applyScheme(SCHEMES[(i + 1) % SCHEMES.length].id);
    paintSettings();
  } else if (e.key === "g" && location.pathname === "/") {
    e.preventDefault();
    $("[data-new-group]")?.click();
  } else if (e.key === "b" && /^\/([0-9a-f-]{36})\/?$/.test(location.pathname)) {
    e.preventDefault();
    $("[data-new-bill]")?.click();
  } else if (e.key === "p" && /^\/([0-9a-f-]{36})\/?$/.test(location.pathname)) {
    e.preventDefault();
    $("[data-new-pay]")?.click();
  } else if (e.key === "/" && location.pathname === "/") {
    e.preventDefault();
    $("#search input")?.focus();
  }
});

window.addEventListener("popstate", render);

applyScheme(scheme, false);
applyLang(lang, false);
render();

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js").catch(() => {});
}
</script>
</body>
</html>
